# Faithful OIM 'slalom' (upstream d6d80a6, scenes.py:588-599 + slalom.xml):
# six static fins forming three alternating 0.240 m gates. Discs below are
# the CIRCUMSCRIBED fallback per fin; the exact axis-aligned boxes are
# supplied at runtime via SAMPLING_C3_OBS_BOXES (index-aligned, overrides
# indices 0-5). Index 6 is the upstream planner-only robot-base circle
# (scenes.py _ROBOT_BASE_RADIUS = 0.09) and stays a true disc.
scenario_name: slalom
obstacles:
- [0.05, 0.22, 0.10198]   # fin_1_near, half (0.10, 0.02)
- [0.57, 0.22, 0.18111]   # fin_1_far,  half (0.18, 0.02)
- [0.245, 0.0, 0.09708]   # fin_2_near, half (0.095, 0.02)
- [0.665, 0.0, 0.08732]   # fin_2_far,  half (0.085, 0.02)
- [0.05, -0.22, 0.10198]  # fin_3_near, half (0.10, 0.02)
- [0.57, -0.22, 0.18111]  # fin_3_far,  half (0.18, 0.02)
- [0.0, 0.0, 0.09]        # robot base disc (planner-only, upstream Circle)
obstacle_cost_weight: 5000.0
obstacle_cost_decay: 0.04
obstacle_model: examples/sampling_c3/urdf/scene_slalom_oimframe.sdf
