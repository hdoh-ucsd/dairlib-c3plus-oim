# Native task/object settings; public names and aliases live in c3plus.configs.catalog.

schema_version: 1

# Start/goal SE(2) poses are imported once in c3plus/configs/poses/.
# Object root height and robot joints remain native profile/scene properties.

# Five joint xArm6 configurations, in radians.
robot_joint_presets:
  t_shape: [0.888666, 0.258649, -1.158786, 0.00013, 0.900238]
  icra_sign: [1.031217, 0.062014, -0.895682, 0.119891, 0.828036]
  icra_sign_s04: [0.972422, 0.310762, -1.230368, 0.06679, 0.916921]

# Settings shared by every indexed experiment.
defaults:
  controller:
    reposition_params_file: examples/sampling_c3/shared_parameters/reposition_params.yaml
    progress_params_file: examples/sampling_c3/shared_parameters/progress_params_c3plus.yaml
    vis_params_file: examples/sampling_c3/shared_parameters/vis_params.yaml
    osc_params_file: examples/sampling_c3/shared_parameters/osc_params_xarm6.yaml
    osqp_settings_file: examples/sampling_c3/shared_parameters/sampling_c3_qp_settings.yaml
    osc_qp_settings_file: examples/sampling_c3/shared_parameters/osc_qp_settings.yaml
    franka_driver_channels_file: common/parameters/franka_drake_lcm_driver_channels.yaml
    lcm_channels_hardware_file: examples/sampling_c3/shared_parameters/lcm_channels_hardware.yaml
    lcm_channels_simulation_file: examples/sampling_c3/shared_parameters/lcm_channels_simulation.yaml
    include_end_effector_orientation: false
    control_loop_delay_ms: 0
  simulation:
    franka_publish_rate: 1000
    object_publish_rate: 10
    actuator_delay: 0.0
    visualize_drake_sim: false
    publish_efforts: true
    dt: 0.0001
    realtime_rate: 1
  goal:
    goal_mode: 2
    position_success_threshold: 0.02
    orientation_success_threshold: 0.1
    resting_object_height: -0.009
    ee_target_z_offset_above_object: 0.06
    lookahead_step_size: 0.15
    lookahead_angle: 2
    angle_hysteresis: 0.4
    angle_err_to_vel_factor: 0
    random_goal_x_limits: [0.44, 0.52]
    random_goal_y_limits: [0.02, 0.25]
    random_goal_radius_limits: [0.5, 0.52]
    resting_object_heights: [-0.002685910000000003, -0.0024437, -0.001956050000000001, 0.0001434999999999978]
    random_goal_gen_max_attempts: 100
    pairwise_goal_distance: 0.2
    only_use_xy_position: true
# Imported objects share one controller profile; each task supplies its imported poses.
# Mass, collision approximations, and evaluation geometry are recorded with the assets.
mesh_object_defaults: &mesh_object_defaults
  extends: T_block
  object_height: -0.029
  sampling_c3_options_file: examples/sampling_c3/shared_parameters/profiles/mesh_objects/sampling_c3plus_options.yaml
  sampling_params_file: examples/sampling_c3/shared_parameters/profiles/mesh_objects/sampling_params.yaml
  physics_metadata_file: examples/sampling_c3/urdf/objects/physics_models.json

# Selected object properties. T_block is the native profile name for public T_shape.
object_profiles:
  T_block:
    controller_model: examples/sampling_c3/urdf/push_t_oimscale_m01_control.sdf
    simulation_model: examples/sampling_c3/urdf/push_t_oimscale_m01.sdf
    object_body_name: vertical_link
    base_name: dummy
    object_height: 0.0008
    sampling_c3_options_file: examples/sampling_c3/shared_parameters/profiles/t_shape/sampling_c3plus_options.yaml
    sampling_params_file: examples/sampling_c3/shared_parameters/profiles/t_shape/sampling_params.yaml
    robot_joint_preset: t_shape
    evaluation:
      footprint:
      - - -0.0445
        - 0.0198
      - - -0.0445
        - 0.0
      - - -0.0099
        - 0.0
      - - -0.0099
        - -0.0794
      - - 0.0099
        - -0.0794
      - - 0.0099
        - 0.0
      - - 0.0445
        - 0.0
      - - 0.0445
        - 0.0198
      block_half_height: 0.0298
      tip_target_z: 0.0298
      object_channel_substring: G_shape_video
  sugar_box:
    <<: *mesh_object_defaults
    simulation_model: examples/sampling_c3/urdf/objects/sugar_box.sdf
    controller_model: examples/sampling_c3/urdf/objects/sugar_box_controller.sdf
    object_body_name: sugar_box_base
    base_name: sugar_box_base
    controller:
      sampling_mesh_files: [examples/sampling_c3/urdf/objects/sugar_box_centered.obj]
  power_drill:
    <<: *mesh_object_defaults
    simulation_model: examples/sampling_c3/urdf/objects/power_drill.sdf
    controller_model: examples/sampling_c3/urdf/objects/power_drill_controller.sdf
    object_body_name: power_drill_base
    base_name: power_drill_base
    controller:
      sampling_mesh_files: [examples/sampling_c3/urdf/objects/power_drill_centered.obj]
  hammer:
    <<: *mesh_object_defaults
    simulation_model: examples/sampling_c3/urdf/objects/hammer.sdf
    controller_model: examples/sampling_c3/urdf/objects/hammer_controller.sdf
    object_body_name: hammer_base
    base_name: hammer_base
    controller:
      sampling_mesh_files: [examples/sampling_c3/urdf/objects/hammer_centered.obj]
  banana:
    <<: *mesh_object_defaults
    simulation_model: examples/sampling_c3/urdf/objects/banana.sdf
    controller_model: examples/sampling_c3/urdf/objects/banana_controller.sdf
    object_body_name: banana_base
    base_name: banana_base
    controller:
      sampling_mesh_files: [examples/sampling_c3/urdf/objects/banana_centered.obj]

# Task differences only. Object geometry and imported poses are selected separately.
# ICRA retains its existing robot presets for every manipulated object.
scenes:
  open_task:
    object_profile: T_block
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/open_task/scenario_params.yaml
    visualize_pairs: [[1, 1]]
  single_obstacle:
    object_profile: T_block
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/single_obstacle/scenario_params.yaml
  shelf_gap:
    object_profile: T_block
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/shelf_gap/scenario_params.yaml
  ycb_clutter:
    object_profile: T_block
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/ycb_clutter/scenario_params.yaml
  icra_sign:
    object_profile: T_block
    robot_joint_preset: icra_sign
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/icra_sign/scenario_params.yaml
    robot_joint_overrides:
      4: icra_sign_s04
  slalom:
    extends: shelf_gap
    scenario_params_file: examples/sampling_c3/shared_parameters/scenes/slalom/scenario_params.yaml
