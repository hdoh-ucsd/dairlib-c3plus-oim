scenario_name: ycb_clutter
# Planner obstacle discs [x, y, r]: circumscribed circles of the OIM
# ycb_clutter footprints (scenes.py). r = max vertex distance from the
# listed center (cube 0.05*sqrt(2); sugar sqrt(0.0875^2+0.0475^2);
# spam/mustard hull vertex radii about each mesh bbox center).
obstacles:
- [0.35, 0.0, 0.0707]     # obs_box cube (shared with single_obstacle)
- [0.22, 0.20, 0.0996]    # domino_sugar box, laid on its side
- [0.60, -0.16, 0.0520]   # spam_can hull
- [0.15, -0.18, 0.0491]   # mustard_bottle hull
- [0.0, 0.0, 0.09]        # robot base disc (planner-only, upstream scenes.py Circle r=0.09)
obstacle_cost_weight: 5000.0
obstacle_cost_decay: 0.04
obstacle_model: examples/sampling_c3/urdf/scene_ycb_clutter_oimframe.sdf
