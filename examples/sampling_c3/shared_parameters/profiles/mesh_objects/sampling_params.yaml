# Single imported object: native horizontal mesh-section sampler (strategy 8).
# EE centre 17 mm above the tabletop; 35 mm normal offset and at least
# 27 mm centre clearance from the original mesh and controller convex pieces.
# Baseline tuning for 0.1 kg benchmark objects; no trials have been run.
sampling_strategy: 8
filter_samples_for_safety: true
num_additional_samples_repos: 3
num_additional_samples_c3: 4
consider_best_buffer_sample_when_leaving_c3: true
N_sample_buffer: 200
pos_error_sample_retention: 0.004
ang_error_sample_retention: 0.05
avoid_choosing_unsuccessful_samples: true
N_unsuccessful_sample_buffer: 10
unsuccessful_pos_error_sample_retention: 0.006
unsuccessful_ang_error_sample_retention: 0.05
unsuccessful_radius: 0.01
sampling_radius: 0.16
sampling_height: 0.005
sample_projection_clearance: 0.027
min_angle_from_vertical: 1.49
max_angle_from_vertical: 1.5
fixed_sample_locations:
- [0.45, 0.27, 0.27]
- [0.34, 0.455, 0.225]
grid_x_limits: [-0.11, 0.11]
grid_y_limits: [-0.11, 0.11]
min_sampling_radius: 0.07
max_sampling_radius: 0.1
buffer_distance: 0.035
max_attempts: 1000
barycentric_bias: 1
z_height: -0.012
gen_planar_samples: true
ee_z_close: false
sample_on_wall: false
c3_min_clearance: 0.01
