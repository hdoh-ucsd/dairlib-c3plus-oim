# Shared initial C3+ tuning for the four imported 0.1 kg benchmark objects.
# Existing single-object tuning; performance is untested.
# Pair friction matches franka_sim --matched_mu: EE/ground, EE/object, object/ground.
# Resolve one nearest EE/convex-piece contact plus three ground witnesses in
# both solve and cost; sugar_box has only one convex collision piece.
