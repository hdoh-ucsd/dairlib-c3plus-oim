# icra_sign, open_table, shelf_gap, single_obstacle, slalom, ycb_clutter
tasks:
  - open_table
  - single_obstacle
  - shelf_gap
  - ycb_clutter
  - icra_sign
  - slalom

# T_shape, hammer, sugar_box, power_drill, banana
objects:
  - T_shape
  - hammer
  - sugar_box
  - power_drill
  - banana

# A preset -- all (25 pairs), diagonal (S1-G1 .. S5-G5), smoke (S1-G1 only) --
# or explicit [start, goal] pairs, for example:
#   pairs:
#     - [2, 2]
#     - [1, 3]
pairs:
  - [1, 1]
  - [1, 2]
  - [1, 3]
  - [1, 4]
  - [1, 5]
  - [2, 1]
  - [2, 2]
  - [2, 3]
  - [2, 4]
  - [2, 5]
  - [3, 1]
  - [3, 2]
  - [3, 3]
  - [3, 4]
  - [3, 5]
  - [4, 1]
  - [4, 2]
  - [4, 3]
  - [4, 4]
  - [4, 5]
  - [5, 1]
  - [5, 2]
  - [5, 3]
  - [5, 4]
  - [5, 5]

# exponential, relu, or both
obstacle_cost: exponential

cap: 300              # Elapsed simulation time budget, in seconds.
video: false          # Skip MP4 rendering. Keeps every recording, metric and result JSON, so `eval` and `--oim-out` still work. This is the flag to use when a sweep only needs numbers.
record: false         # Skip the recorder entirely. Logs only: no telemetry, no result JSON, no metrics, nothing to resume or evaluate. 
