# C++ port single_obstacle extraction (worktree oim-scene-sync-metrics).
# Paths relative to repo root; file:line provenance on each value.
# Trials: examples/sampling_c3/matched_single_obstacle_xarm6_t1..t5 (identical
# except q_init_object / q_init_franka / fixed_target_*).
scene: single_obstacle   # scenario_params.yaml:1 (all trials)
frame: OIM-native (rigid identity registration); table top at z=-0.029, object rest z ~ 0.0008

object:
  model: examples/sampling_c3/urdf/push_t_oimscale_m01.sdf   # t*/parameters/sim_params.yaml:1
  crossbar_box: [0.089, 0.0198, 0.0596]     # push_t_oimscale_m01.sdf:13 (= half 0.0445,0.0099,0.0298)
  stem_box: [0.0198, 0.0794, 0.0596]        # push_t_oimscale_m01.sdf:28 (= half 0.0099,0.0397,0.0298)
  geom_masses: [0.0528504, 0.0471496]       # sdf:8,24 — area-proportional split, total 0.1000000
  total_mass: 0.1
  friction: --matched_mu=true override      # franka_sim.cc:154-186
    # object mu 0.3, ground/platform 0.3 -> T-table pair 0.3 (matches tee.xml 0.3)
    # EE 1.5 -> EE-T pair 0.5; obstacle 1.5 -> object-obstacle pair 0.5 (MJX geom default 0.5)

obstacle_sim:
  count: 1
  model: examples/sampling_c3/urdf/single_obstacle_box_oimframe.sdf   # t*/parameters/scenario_params.yaml:6
  geometry: box 0.1 x 0.1 x 0.1             # single_obstacle_box_oimframe.sdf:19,23
  pose: [0.35, 0.0, 0.021]                  # sdf:17 (platform top z=-0.029 -> bottom -0.029, top +0.071; 0.10 above table = MJX)
  orientation: identity
  static: true                              # sdf:15 <static>true</static>
  visual: orange box, diffuse 0.85 0.35 0.1 # sdf:20

obstacle_planner:                            # consumed under SAMPLING_C3_OBSTACLE_MODE=lcs_contact
  source: t*/parameters/scenario_params.yaml:2-3  ->  "obstacles: [[0.35, 0.0, 0.0707]]"
  default_representation: disc [x=0.35, y=0.0, r=0.0707]   # r = 0.05*sqrt(2), circumscribed circle of the cube footprint
    # ObsSdfPoint fallback: sampling_based_c3_controller.cc:434 (hypot - o[2])
  exact_box_override: SAMPLING_C3_OBS_BOXES="0.35,0.0,0.05,0.05"   # cc:920; gives exact AABB SDF (cc:427-433)
  no_robot_base_obstacle: true               # scenario list has 1 entry; upstream planner field also carries base disc r=0.09
  extras_not_in_upstream:
    obstacle_cost_weight: 5000.0             # scenario_params.yaml:4 (ranking cost, active even without env mode)
    obstacle_cost_decay: 0.04                # scenario_params.yaml:5
    obs_margin_default: 0.01                 # SAMPLING_C3_OBJ_MARGIN default (t1 README; cc ObsCfg)

starts:   # q_init_object [qw,qx,qy,qz,x,y,z], t*/parameters/sim_params.yaml:17; yaw = 2*atan2(qz,qw)
  1: [0.381, 0.400, 0.0]        # t1: [1,0,0,0, 0.381,0.4,0.0008]
  2: [0.366, 0.431, 0.057909]   # t2: [0.999581,0,0,0.028946, ...]
  3: [0.391, 0.437, -0.408204]  # t3: [0.979244,0,0,-0.202686, ...]
  4: [0.361, 0.357, 0.328201]   # t4: [0.986566,0,0,0.163364, ...]
  5: [0.406, 0.383, 0.280601]   # t5: [0.990174,0,0,0.13984, ...]
goals:    # fixed_target_position / _orientation [qw,0,0,qz], t*/parameters/goal_params.yaml:30-31
  1: [0.381, -0.400, 3.141600]  # qw=-3.67321e-06, qz=1 -> yaw ~ pi (wraps to -3.14159...+)
  2: [0.397, -0.431, 3.239996]  # qw=-0.0491838, qz=0.99879
  3: [0.404, -0.393, 2.792400]  # qw=0.173711,  qz=0.984797
  4: [0.386, -0.424, 2.770400]  # qw=0.184533,  qz=0.982826
  5: [0.359, -0.424, 2.733800]  # qw=0.202486,  qz=0.979285

success:  # t*/parameters/goal_params.yaml:10-11 (all trials)
  position_success_threshold: 0.02   # UPSTREAM IS 0.05 — port is stricter
  orientation_success_threshold: 0.1

robot:
  q_init_franka: [0.888666, 0.258649, -1.158786, 0.00013, 0.900238]  # sim_params.yaml:16 (5-joint xarm6, IK for tip [0.3266,0.4007,0.0732])

stale_docs:
  - examples/sampling_c3/matched_single_obstacle_xarm6_t1/README.md still describes the
    legacy shifted layout (obstacle [0.5,0.0], start [0.5,0.3], goal [0.5,-0.3],
    single_obstacle_box.sdf); the yamls have been re-based to the OIM frame.
