manipulated_object:
  model: examples/sampling_c3/urdf/push_t_oimscale_m01.sdf  # sim_params.yaml:1-2
  links:
    vertical_link (crossbar): {box full: [0.089, 0.0198, 0.0596], pose y=+0.0099, mass: 0.0528504}  # push_t_oimscale_m01.sdf:6-18
    horizontal_link (stem):   {box full: [0.0198, 0.0794, 0.0596], link pose y=-0.0397, mass: 0.0471496}  # sdf:21-33
  total_mass: 0.1  # uniform-density split (upstream declares 0.05/0.05 per geom)
  start_pose: q_init_object [1, 0, 0, 0, 0.381, 0.4, 0.0008]  # sim_params.yaml:17-18 -> (0.381, 0.4, yaw 0); z 0.0008 = 0.0298 - 0.029 (frame map)
