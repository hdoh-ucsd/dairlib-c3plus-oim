    fixed_target_position: [0.381, -0.4, 0.0008]
    fixed_target_orientation: [-3.67321e-06, 0, 0, 1]  # wxyz -> yaw = pi (to ~7e-6 rad)

obstacle_sim_model: examples/sampling_c3/urdf/scene_ycb_clutter_oimframe.sdf  # scenario_params.yaml:13, <static>true</static> (sdf:16)
obstacles_sim:  # all static, no friction tags in SDF (see friction section)
  obs_box:        {box full: [0.1, 0.1, 0.1],      pose: [0.35, 0.0, 0.021]}     # sdf:17-21   (0.05 - 0.029)
  domino_sugar:   {box full: [0.175, 0.095, 0.06], pose: [0.22, 0.20, 0.001]}    # sdf:22-26   (0.03 - 0.029)
  spam_can:       {mesh: urdf/ycb_hulls/spam_can.obj (8-vert hull prism, h=0.0835), pose: [0.60, -0.16, 0.01275]}  # sdf:27-32 (0.0418 - 0.029)
  mustard_bottle: {mesh: urdf/ycb_hulls/mustard_bottle.obj (8-vert hull prism, h=0.1913), pose: [0.15, -0.18, 0.06665]}  # sdf:33-38 (0.0957 - 0.029)
  # hull OBJs are exact extrusions of scenes.py footprint polygons, centered on
  # bbox centers (spam_can.obj:1-2, mustard_bottle.obj:1-2); vertex values verified
  # against scenes.py:248-266 (exact to 1e-4).

planner_obstacles:  # scenario_params.yaml:6-10 — DISCS [x, y, r], circumscribed circles of the OIM footprints
  - [0.35, 0.0, 0.0707]    # obs_box cube
  - [0.22, 0.20, 0.0996]   # domino_sugar
  - [0.60, -0.16, 0.0520]  # spam_can hull
  - [0.15, -0.18, 0.0491]  # mustard_bottle hull
  # NO robot-base disc (upstream planner adds Circle((0,0), r=0.09));
  # partial mitigation only via robot_radius_limits [0.25, 0.70]
  # (sampling_c3plus_options.yaml, per README.md:19)
planner_obstacle_count: 4
obstacle_cost_weight: 5000.0  # scenario_params.yaml:11
obstacle_cost_decay: 0.04     # scenario_params.yaml:12

friction:
  # SDFs carry no friction; franka_sim.cc overrides at startup only with
  # --matched_mu (franka_sim.cc:65-68, 151-196):
  #   kObjectMu 0.3, kGroundMu 0.3, kEeMu 1.5, kObstacleMu 1.5 (cc:155-164)
  #   harmonic pairs: T-table 0.3 (= upstream tee.xml:150-151),
  #   object-obstacle harmonic(0.3, 1.5) = 0.5 (= upstream common.xml:50 geom mu 0.5)
  # README.md:49 run recipe passes --matched_mu=true --robot_model=xarm6;
  # franka_sim_t.pmd (stale generic copy) passes NEITHER flag.
  planner_mu_per_pair_type: [0.4165, 1, 0.4615]  # sampling_c3_options.yaml:41 (pre-matched legacy values)
  osc_mu: 0.4615  # osc_params_xarm6.yaml:10

robot: xarm6, 5-joint (joint6 welded); q_init_franka 5-dim (sim_params.yaml:16)

notes:
  - README.md:14-16 claims start [0.5, 0.3] / goal [0.5, -0.3]; STALE — actual
    yamls carry the OIM pair-1 poses (0.381, +/-0.4).
  - Visuals are hull prisms / plain boxes, not the textured YCB scans (cosmetic).
