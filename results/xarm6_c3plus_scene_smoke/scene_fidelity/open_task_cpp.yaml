success_thresholds:   # goal_params.yaml:10-11 (all 5 dirs identical)
  position_success_threshold: 0.02   # m  -- TIGHTER than upstream 0.05
  orientation_success_threshold: 0.1 # rad -- matches upstream

friction:
  sim: --matched_mu flag, examples/sampling_c3/franka_sim.cc:65,151-198
    object_mu: 0.3, ground/platform_mu: 0.3, ee_mu: 1.5, obstacle_mu: 1.5
    Drake harmonic pairs -> object-table 0.3 (matches upstream 0.3),
    ee-object 0.5 (matches upstream default-geom 0.5)
  planner: sampling_c3plus_options.yaml:47 mu_per_pair_type [0.4165, 1, 0.4615]
    (ee-ground, ee-T, T-ground) -- anything-lineage defaults, NOT matched to
    0.3/0.5; same in every matched_* scene (consistent family divergence).

obstacles:
  scenario_params.yaml:2-3: obstacles: []   # empty, no placeholder
  scenario_params.yaml:4: obstacle_cost_weight: 0.0
  obstacle_model: absent (optional; franka_sim.cc:132-138 only parses it when
    has_value) -> no obstacle body enters the sim plant
  planner: every obstacle branch in
    systems/controllers/sampling_based_c3_controller.cc (:1200, :2076, :2236,
    :2342, :2522) is guarded by !scenario_params.obstacles.empty() -- with []
    no (0,0,0) placeholder can reach planner or collision logic; env-var
    SAMPLING_C3_OBSTACLE_MODE paths (cc:883) only add mechanisms, never geometry.

frame:
  Drake world with xArm6 base at origin (same as upstream xarm_device frame);
  object z 0.0008 in state (resting_object_height -0.009, goal_params.yaml:13)
  -- x/y/yaw are the compared planar quantities.
