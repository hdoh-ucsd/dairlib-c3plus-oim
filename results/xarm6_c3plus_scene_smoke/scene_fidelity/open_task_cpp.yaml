  "4": {x: 0.361, y: 0.357, quat: [0.986566, 0, 0, 0.163364], yaw: 0.328199}
  "5": {x: 0.406, y: 0.383, quat: [0.990174, 0, 0, 0.13984], yaw: 0.280600}
